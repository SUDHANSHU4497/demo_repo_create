[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-devops"
version = "0.1.0"
description = "Agentic CI/CD for Azure Databricks + Azure DevOps: data validation, QA promotion and production release agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Agent runtime (CLI / pipelines). The Databricks validation job needs none of these.
agents = ["langgraph>=1.2,<2", "langchain-core>=1.7,<2", "pydantic>=2.7", "azure-identity>=1.15"]
# Models hosted in Azure AI Foundry (GPT, Mistral, Llama, DeepSeek via the OpenAI API; Claude via Anthropic API)
foundry = ["langchain-azure-ai>=1.2,<2", "langchain-anthropic>=1.7,<2", "langchain-openai>=1.7,<2"]
# LLM call tracing to Application Insights (OpenTelemetry GenAI spans)
tracing = ["langchain-azure-ai[opentelemetry]>=1.2,<2"]
# Escape hatch: any LangChain provider through init_chat_model("provider:model")
langchain = ["langchain>=1.4,<2"]
azure = ["azure-identity>=1.15"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "pandas>=2.0", "ruff>=0.5", "agentic-devops[agents]"]

[project.scripts]
agentic-devops = "agentic_devops.cli:main"
agentic-validation-job = "agentic_devops.validation.job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]  # Databricks notebooks use injected globals (spark, dbutils)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "E501"]  # line length is handled by `ruff format`
