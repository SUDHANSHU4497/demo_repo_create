[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-devops"
version = "0.1.0"
description = "Agentic CI/CD for Azure Databricks + Azure DevOps: data validation, QA promotion and production release agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = ["anthropic>=2.3"]
azure = ["azure-identity>=1.15"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "pandas>=2.0", "ruff>=0.5"]

[project.scripts]
agentic-devops = "agentic_devops.cli:main"
agentic-validation-job = "agentic_devops.validation.job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]  # Databricks notebooks use injected globals (spark, dbutils)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "E501"]  # line length is handled by `ruff format`
